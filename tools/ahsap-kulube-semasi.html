<!doctype html>
<!-- Blog görseli: "Ahşap kulübe ve hobi uygulamalarında nelere dikkat edilmelidir?" (2026-11-27)
     PNG: Chrome --headless --window-size=1400,722 --screenshot; og için 1200×630 kırpım.
     Tik tonları yaklaşık; kat sayısıyla koyulaşmayı anlatmak içindir, renk referansı değildir. -->
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#fff;}body{width:1400px;height:722px;font-family:'Inter',sans-serif;}</style>
</head><body>
<svg width="1400" height="722" viewBox="0 0 1400 722" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <defs>
    <pattern id="ham" width="400" height="24" patternUnits="userSpaceOnUse">
      <rect width="400" height="24" fill="#e2c9a2"/><rect y="22" width="400" height="2" fill="#c9ad83"/>
    </pattern>
    <pattern id="tik" width="400" height="24" patternUnits="userSpaceOnUse">
      <rect width="400" height="24" fill="#a8733d"/><rect y="22" width="400" height="2" fill="#8a5a2c"/>
    </pattern>
    <clipPath id="sag"><rect x="290" y="0" width="300" height="600"/></clipPath>
  </defs>
  <rect width="1400" height="722" fill="#fff"/>
  <text x="80" y="76" font-size="30" font-weight="800" fill="#0d0d10" letter-spacing="-.6">Ahşap kulübe: renkli vernikle üç adım</text>
  <text x="80" y="109" font-size="17" font-weight="500" fill="#54526a">Örnek: Esfera Dış Cephe Renkli Vernik 703505 Tik</text>
  <line x1="80" y1="134" x2="1320" y2="134" stroke="rgba(0,0,0,0.09)"/>

  <!-- kulübe: sol yarı ham, sağ yarı vernikli -->
  <g transform="translate(90,170)">
    <path d="M60 170 L250 60 L440 170 Z" fill="#3b3b45"/>
    <rect x="90" y="170" width="320" height="250" fill="url(#ham)"/>
    <rect x="90" y="170" width="320" height="250" fill="url(#tik)" clip-path="url(#sag)"/>
    <rect x="200" y="290" width="80" height="130" fill="#6d4a2a"/>
    <rect x="320" y="220" width="60" height="55" fill="#e8eef8" stroke="#5a3a1e" stroke-width="5"/>
    <line x1="290" y1="170" x2="290" y2="420" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="50" y1="420" x2="450" y2="420" stroke="#555" stroke-width="3"/>
    <text x="180" y="455" text-anchor="middle" font-size="15" font-weight="600" fill="#54526a">zımparalanmış ham ahşap</text>
    <text x="355" y="455" text-anchor="middle" font-size="15" font-weight="600" fill="#54526a">renkli vernik</text>
  </g>

  <!-- adımlar -->
  <g font-size="15">
    <g transform="translate(640,170)">
      <rect width="680" height="92" rx="12" fill="#f4f5fb" stroke="rgba(38,53,140,0.18)"/>
      <rect x="20" y="26" width="40" height="40" rx="8" fill="#26358c"/><text x="40" y="53" text-anchor="middle" font-weight="700" fill="#fff" font-size="18">1</text>
      <text x="80" y="40" font-size="19" font-weight="700" fill="#0d0d10">Zımpara: 220–400 kum</text>
      <text x="80" y="66" fill="#54526a">Temiz yüzeyde gözenek açar, verniğin yapışmasını artırır.</text>
    </g>
    <g transform="translate(640,276)">
      <rect width="680" height="92" rx="12" fill="#f4f5fb" stroke="rgba(38,53,140,0.18)"/>
      <rect x="20" y="26" width="40" height="40" rx="8" fill="#26358c"/><text x="40" y="53" text-anchor="middle" font-weight="700" fill="#fff" font-size="18">2</text>
      <text x="80" y="40" font-size="19" font-weight="700" fill="#0d0d10">Renkli vernik: %20'ye kadar su</text>
      <text x="80" y="66" fill="#54526a">Fırça, rulo, tabanca ya da bez ile.</text>
    </g>
    <g transform="translate(640,382)">
      <rect width="680" height="92" rx="12" fill="#f4f5fb" stroke="rgba(38,53,140,0.18)"/>
      <rect x="20" y="26" width="40" height="40" rx="8" fill="#26358c"/><text x="40" y="53" text-anchor="middle" font-weight="700" fill="#fff" font-size="18">3</text>
      <text x="80" y="40" font-size="19" font-weight="700" fill="#0d0d10">Yoklama zımparası ve sonraki kat</text>
      <text x="80" y="66" fill="#54526a">Ortalama 3 kata kadar önerilir.</text>
    </g>
    <!-- koyulaşma -->
    <g transform="translate(640,496)">
      <text x="0" y="22" font-size="16" font-weight="700" fill="#0d0d10">Her kat rengi koyulaştırır: önce küçük alanda deneyin</text>
      <g transform="translate(0,40)">
        <rect width="120" height="60" rx="8" fill="#b7844d"/><text x="60" y="84" text-anchor="middle" fill="#54526a">1 kat</text>
        <path d="M134 30 H160" stroke="#9aa0b4" stroke-width="2"/>
        <rect x="174" width="120" height="60" rx="8" fill="#966331"/><text x="234" y="84" text-anchor="middle" fill="#54526a">2 kat</text>
        <path d="M308 30 H334" stroke="#9aa0b4" stroke-width="2"/>
        <rect x="348" width="120" height="60" rx="8" fill="#784b22"/><text x="408" y="84" text-anchor="middle" fill="#54526a">3 kat</text>
      </g>
    </g>
  </g>
</svg>
</body></html>
