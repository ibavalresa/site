<!doctype html>
<!-- Blog görseli: "Ahşap ev boya tadilatı ne zaman ve nasıl yapılmalıdır?" (2026-11-27)
     PNG: Chrome --headless --window-size=1400,722 --screenshot; og için 1200×630 kırpım. -->
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#fff;}body{width:1400px;height:722px;font-family:'Inter',sans-serif;}</style>
</head><body>
<svg width="1400" height="722" viewBox="0 0 1400 722" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <defs>
    <pattern id="tahta" width="400" height="22" patternUnits="userSpaceOnUse">
      <rect width="400" height="22" fill="#c99a63"/><rect y="20" width="400" height="2" fill="#a97a46"/>
    </pattern>
    <pattern id="tahtaYipranmis" width="400" height="22" patternUnits="userSpaceOnUse">
      <rect width="400" height="22" fill="#b9a993"/><rect y="20" width="400" height="2" fill="#988771"/>
      <rect x="40" y="6" width="60" height="5" rx="2" fill="#d8cdbd"/><rect x="190" y="12" width="40" height="4" rx="2" fill="#d8cdbd"/>
    </pattern>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#26358c"/></marker>
  </defs>
  <rect width="1400" height="722" fill="#fff"/>

  <text x="80" y="76" font-size="30" font-weight="800" fill="#0d0d10" letter-spacing="-.6">Ahşap ev boya tadilatı: önce incele, sonra dört adım</text>
  <text x="80" y="109" font-size="17" font-weight="500" fill="#54526a">Cepheler aynı hızda yıpranmaz; her cephe ayrı değerlendirilir.</text>
  <line x1="80" y1="134" x2="1320" y2="134" stroke="rgba(0,0,0,0.09)"/>

  <!-- ══ ev: iki cephe ══ -->
  <g transform="translate(80,180)">
    <!-- güneş ve yağmur -->
    <circle cx="70" cy="40" r="26" fill="#f2b33d"/>
    <g stroke="#f2b33d" stroke-width="4" stroke-linecap="round">
      <line x1="70" y1="0" x2="70" y2="-8"/><line x1="110" y1="40" x2="118" y2="40"/><line x1="30" y1="40" x2="22" y2="40"/>
      <line x1="98" y1="12" x2="104" y2="6"/><line x1="42" y1="12" x2="36" y2="6"/><line x1="98" y1="68" x2="104" y2="74"/>
    </g>
    <g stroke="#7d93c9" stroke-width="3" stroke-linecap="round">
      <line x1="470" y1="10" x2="462" y2="30"/><line x1="492" y1="18" x2="484" y2="38"/><line x1="514" y1="8" x2="506" y2="28"/><line x1="536" y1="20" x2="528" y2="40"/>
    </g>
    <!-- çatı -->
    <path d="M100 150 L300 70 L500 150 Z" fill="#3b3b45"/>
    <!-- sol cephe: güneşe bakan, yıpranmış -->
    <rect x="120" y="150" width="180" height="230" fill="url(#tahtaYipranmis)"/>
    <!-- sağ cephe: korunaklı -->
    <rect x="300" y="150" width="180" height="230" fill="url(#tahta)"/>
    <rect x="345" y="200" width="70" height="80" fill="#e8eef8" stroke="#7a5a35" stroke-width="5"/>
    <rect x="175" y="290" width="60" height="90" fill="#8a6a45"/>
    <line x1="300" y1="150" x2="300" y2="380" stroke="#6d5236" stroke-width="3"/>
    <line x1="90" y1="380" x2="510" y2="380" stroke="#555" stroke-width="3"/>
    <!-- etiketler -->
    <text x="210" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#0d0d10">Güneş ve yağış alan cephe</text>
    <text x="210" y="443" text-anchor="middle" font-size="14" fill="#54526a">kalkma, çatlak, boyasız ahşap</text>
    <text x="210" y="463" text-anchor="middle" font-size="14" font-weight="600" fill="#b4441f">→ tadilat zamanı</text>
    <text x="390" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#0d0d10">Korunaklı cephe</text>
    <text x="390" y="443" text-anchor="middle" font-size="14" fill="#54526a">kenarda hafif çatlak</text>
    <text x="390" y="463" text-anchor="middle" font-size="14" font-weight="600" fill="#2f7d4f">→ lokal müdahale yeter</text>
  </g>

  <!-- ══ dört adım ══ -->
  <g font-size="15">
    <g transform="translate(660,180)">
      <rect width="660" height="100" rx="12" fill="#f4f5fb" stroke="rgba(38,53,140,0.18)"/>
      <rect x="20" y="30" width="40" height="40" rx="8" fill="#26358c"/><text x="40" y="57" text-anchor="middle" font-weight="700" fill="#fff" font-size="18">1</text>
      <text x="80" y="43" font-size="19" font-weight="700" fill="#0d0d10">Temizle ve zımparala</text>
      <text x="80" y="70" fill="#54526a">Eski boya, vernik ve yağ kalıntıları tamamen uzaklaştırılır.</text>
    </g>
    <g transform="translate(660,296)">
      <rect width="660" height="100" rx="12" fill="#f4f5fb" stroke="rgba(38,53,140,0.18)"/>
      <rect x="20" y="30" width="40" height="40" rx="8" fill="#26358c"/><text x="40" y="57" text-anchor="middle" font-weight="700" fill="#fff" font-size="18">2</text>
      <text x="80" y="43" font-size="19" font-weight="700" fill="#0d0d10">Renklendir</text>
      <text x="80" y="70" fill="#54526a">Esfera Ahşap Renklendirici (7034XX) · bez veya fırça ile</text>
    </g>
    <g transform="translate(660,412)">
      <rect width="660" height="100" rx="12" fill="#f4f5fb" stroke="rgba(38,53,140,0.18)"/>
      <rect x="20" y="30" width="40" height="40" rx="8" fill="#26358c"/><text x="40" y="57" text-anchor="middle" font-weight="700" fill="#fff" font-size="18">3</text>
      <text x="80" y="43" font-size="19" font-weight="700" fill="#0d0d10">Vernikle</text>
      <text x="80" y="70" fill="#54526a">Esfera Dış Mekan Şeffaf Vernik (70020X) · ilk kat fırça ile</text>
    </g>
    <g transform="translate(660,528)">
      <rect width="660" height="100" rx="12" fill="#f4f5fb" stroke="rgba(38,53,140,0.18)"/>
      <rect x="20" y="30" width="40" height="40" rx="8" fill="#26358c"/><text x="40" y="57" text-anchor="middle" font-weight="700" fill="#fff" font-size="18">4</text>
      <text x="80" y="43" font-size="19" font-weight="700" fill="#0d0d10">Katları tamamla</text>
      <text x="80" y="70" fill="#54526a">Vernik toplam 2–3 kat; tabancayla ince katlar da uygulanabilir.</text>
    </g>
  </g>
  <path d="M600 330 C 625 330, 630 330, 650 330" stroke="#26358c" stroke-width="3" fill="none" marker-end="url(#ok)"/>
</svg>
</body></html>
